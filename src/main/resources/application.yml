server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: triage
  config:
    # Loads TYPESAFE_API_KEY from a local .env file (git-ignored) if present.
    # A real OS environment variable of the same name works too.
    import: optional:file:.env[.properties]
  ai:
    typesafe:
      api-key: ${TYPESAFE_API_KEY}
      model: jev-latest
