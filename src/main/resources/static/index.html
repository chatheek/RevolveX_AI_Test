<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ResolveX - AI Triage & Escalation Engine</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sends the CSRF token on changes and returns to the login page when the session has ended.
        const csrfToken = () => decodeURIComponent(
            (document.cookie.split("; ").find(c => c.startsWith("XSRF-TOKEN=")) || "").split("=")[1] || "");

        async function apiFetch(url, options = {}) {
            const headers = { ...(options.headers || {}) };
            if ((options.method || "GET").toUpperCase() !== "GET") headers["X-XSRF-TOKEN"] = csrfToken();
            const res = await fetch(url, { ...options, headers, credentials: "same-origin" });
            if (res.status === 401) {
                window.location.href = "/login";
                throw new Error("Session expired. Please sign in again.");
            }
            return res;
        }

        function App() {
            const [hierarchy, setHierarchy] = useState({});
            const [feedback, setFeedback] = useState("");
            const [loading, setLoading] = useState(false);
            const [escalating, setEscalating] = useState(false);
            const [triage, setTriage] = useState(null);

            const [username, setUsername] = useState("");

            useEffect(() => {
                apiFetch("/api/v1/hierarchy")
                    .then(res => res.json())
                    .then(data => setHierarchy(data))
                    .catch(err => console.error(err));
                apiFetch("/api/v1/me")
                    .then(res => res.json())
                    .then(data => setUsername(data.username))
                    .catch(err => console.error(err));
            }, []);

            const handleSignOut = async () => {
                try { await apiFetch("/logout", { method: "POST" }); } catch (err) { /* leave anyway */ }
                window.location.href = "/login?logout";
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!feedback.trim()) return;
                setLoading(true);
                try {
                    const res = await apiFetch("/api/v1/complaints/triage", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ feedback })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || data.error || "Request failed");
                    setTriage({ ...data, feedback });
                } catch (err) {
                    alert("Error analyzing feedback: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleEscalate = async () => {
                if (!triage || escalating) return;
                setEscalating(true);
                try {
                    const res = await apiFetch("/api/v1/complaints/escalate", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            feedback: triage.feedback,
                            currentRole: triage.routedTo,
                            isDirectAgainstBranchManager: triage.isDirectAgainstBranchManager,
                            history: triage.escalationHistory
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.message || data.error || "Request failed");
                    setTriage({
                        ...triage,
                        routedTo: data.escalatedTo,
                        routedLevel: data.escalatedLevel,
                        escalationHistory: data.escalationHistory,
                        confidence: data.confidence != null ? data.confidence : triage.confidence
                    });
                } catch (err) {
                    alert("Escalation failed: " + err.message);
                } finally {
                    setEscalating(false);
                }
            };

            // Calculate if max escalation ceiling is reached
            const isEscalationDisabled = () => {
                if (!triage) return true;
                if (triage.routedTo === "Tenant Admin") return true;
                if (!triage.isDirectAgainstBranchManager && triage.routedTo === "Branch Manager") return true;
                return false;
            };

            return (
                <div className="max-w-7xl mx-auto space-y-8">
                    <header className="border-b border-slate-800 pb-4 flex items-start justify-between gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-sky-400">ResolveX Triage Engine</h1>
                            <p className="text-slate-400 text-sm">Spring AI with TypeSafe Jev Model</p>
                        </div>
                        <div className="text-right text-sm">
                            {username && <p className="text-slate-400">Signed in as <span className="text-slate-200 font-semibold">{username}</span></p>}
                            <button
                                onClick={handleSignOut}
                                className="mt-1 px-3 py-1 text-xs font-bold bg-slate-700 hover:bg-slate-600 rounded-lg transition"
                            >
                                Sign out
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        {/* Feedback Input */}
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <h2 className="text-xl font-semibold mb-4">Customer Feedback</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <textarea
                                    value={feedback}
                                    onChange={(e) => setFeedback(e.target.value)}
                                    placeholder="e.g., Security guard was not polite... OR Branch manager ignored us..."
                                    className="w-full h-36 p-3 bg-slate-900 rounded-lg border border-slate-700 text-white focus:outline-none focus:border-sky-500"
                                />
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full py-3 bg-sky-600 hover:bg-sky-500 font-bold rounded-lg transition"
                                >
                                    {loading ? "Jev AI Classifying..." : "Analyze Feedback"}
                                </button>
                            </form>
                        </div>

                        {/* Triage Output Card */}
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                            <div>
                                <h2 className="text-xl font-semibold mb-4">Current Assignment</h2>
                                {triage ? (
                                    <div className="space-y-4">
                                        <div className="bg-slate-900 p-4 rounded-lg border border-slate-700">
                                            <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Assigned To:</span>
                                            <p className="text-3xl text-emerald-400 font-extrabold mt-1">
                                                {triage.routedTo} <span className="text-base font-normal text-slate-400">(Level {triage.routedLevel})</span>
                                            </p>
                                        </div>

                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700">
                                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Priority:</span>
                                                <p className="text-xl text-amber-400 font-bold mt-1">{triage.priority}</p>
                                            </div>
                                            <div className="bg-slate-900 p-4 rounded-lg border border-slate-700">
                                                <span className="text-slate-400 text-xs font-bold uppercase tracking-wider">Jev Confidence:</span>
                                                <p className={`text-xl font-bold mt-1 ${triage.confidence < 50 ? 'text-rose-400' : 'text-cyan-400'}`}>
                                                    {triage.confidence}% {triage.confidence < 50 && <span className="text-xs text-rose-300">(Untrustworthy AI Output)</span>}
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <p className="text-slate-500 italic">Submit feedback to see initial AI assignment.</p>
                                )}
                            </div>

                            {triage && (
                                <button
                                    onClick={handleEscalate}
                                    disabled={isEscalationDisabled() || escalating}
                                    className={`w-full mt-4 py-3 font-bold rounded-lg transition ${
                                        isEscalationDisabled()
                                            ? "bg-slate-700 text-slate-500 cursor-not-allowed border border-slate-600"
                                            : "bg-rose-600 hover:bg-rose-500 text-white"
                                    }`}
                                >
                                    {isEscalationDisabled() ? "Maximum Escalation Level Reached 🔒" : escalating ? "Jev AI Escalating..." : "Escalate Complaint ⬆ (AI)"}
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Escalation History Log */}
                    {triage && triage.escalationHistory && (
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <h2 className="text-xl font-semibold mb-4 text-emerald-400">Escalation History Log</h2>
                            <div className="space-y-3">
                                {triage.escalationHistory.map((item, idx) => (
                                    <div key={idx} className="flex items-center justify-between p-3 bg-slate-900 rounded-lg border border-slate-700">
                                        <div className="flex items-center gap-3">
                                            <span className="px-2.5 py-1 bg-slate-800 border border-slate-600 text-xs font-bold text-sky-400 rounded-full">
                                                Step {item.step}
                                            </span>
                                            <div>
                                                <p className="font-bold text-white">{item.assignedTo} <span className="text-xs text-slate-400 font-normal">(Level {item.level})</span></p>
                                                <p className="text-xs text-slate-400">{item.action}</p>
                                            </div>
                                        </div>
                                        <span className="text-xs text-slate-500">{item.timestamp}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Hierarchy Visualizer */}
                    <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                        <h2 className="text-xl font-semibold mb-6">Branch Hierarchy Tree</h2>
                        <div className="space-y-4">
                            {[5, 4, 3, 2, 1].map(level => (
                                <div key={level} className="flex items-center gap-4">
                                    <div className="w-20 text-right">
                                        <span className="px-2 py-1 bg-slate-700 text-xs font-bold rounded">Level {level}</span>
                                    </div>
                                    <div className="flex-1 flex flex-wrap gap-2 p-3 bg-slate-900 rounded-lg border border-slate-700">
                                        {hierarchy[level]?.map(item => {
                                            const active = triage && triage.routedTo === item.title;
                                            return (
                                                <div
                                                    key={item.title}
                                                    title={item.description}
                                                    className={`p-2 rounded text-xs transition ${
                                                        active 
                                                            ? "bg-emerald-600 text-white font-bold ring-2 ring-emerald-300 scale-105" 
                                                            : "bg-slate-800 text-slate-300 border border-slate-700"
                                                    }`}
                                                >
                                                    {item.title}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
